[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autodoc"
version = "0.1.0"
description = "AI-assisted engineering documentation and session tracking from the command line"
dependencies = [
    "click",
    "google-genai",
    "Pillow",
]

[project.scripts]
autodoc = "autodoc.cli:cli"
autodoc-public = "autodoc.public_cli:cli"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["autodoc*"]